services:
  - type: web
    name: dev-orbit-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false # You will need to set this in the Render dashboard
      - key: SECRET_KEY
        sync: false # You will need to set this in the Render dashboard
